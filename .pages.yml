media: media

content:
  - name: products
    label: OUTFITI Products
    type: file
    path: content/products.json
    format: json
    list: true
    fields:
      - name: id
        label: Product ID
        type: string
      - name: name
        label: Product Name
        type: string
        required: true
      - name: price
        label: Price (DH)
        type: number
        required: true
      - name: originalPrice
        label: Original Price (DH)
        type: number
      - name: salePrice
        label: Sale Price (DH)
        type: number
      - name: featured
        label: Featured Product
        type: boolean
      - name: isNew
        label: Mark as New
        type: boolean
      - name: image
        label: Product Image
        type: image
      - name: gallery
        label: Product Gallery (up to 6 images)
        type: image
        options:
          multiple:
            max: 6
          unique: true
      - name: description
        label: Description
        type: text
      - name: category
        label: Category
        type: string
      - name: sizes
        label: Sizes
        type: string
        list: true
      - name: colors
        label: Colors
        type: string
        list: true
      - name: stock
        label: Stock Quantity
        type: number
      - name: cost
        label: Unit Cost (DH)
        type: number
